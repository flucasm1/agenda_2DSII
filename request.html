<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<title>AGENDA2DSII</title>

<body class="fundo">
<h2 class="w3-container w3-teal">Cadastro de Candidatos</h2>
<form class="w3-container" method="post" action="processaCadastro.php">
<br>
<label class="w3-text-teal"><b>Nome:</b></label>
<input name="nome" type="text" class="w3-input w3-border w3-light-grey" placeholder = "Digitar Nome"><br>
<label class="w3-text-teal"><b>Idade:</b></label>
<input name="idade" type="text" class="w3-input w3-border w3-light-grey" placeholder = "Ex.: 18"><br>
<label class="w3-text-teal"><b>Profissão:</b></label>
<input name="profi" type="text" class="w3-input w3-border w3-light-grey" placeholder = "Ex: Professor"><br>
<label class="w3-text-teal"><b>Salário Desejado:</b></label>
<input name="sal" type="text" class="w3-input w3-border w3-light-grey" id="sal" placeholder = "Ex: 1000"><br>
<label class="w3-text-teal"><b>Experiências:</b></label>
<input name="exp" type="text" class="w3-input w3-border w3-light-grey" id="exp" placeholder = "Ex: Auxiliar..."><br>
<input name="Enviar" type="submit" class="w3-btn w3-teal" id="enviar" value="enviar">
</form>
</body>
</html>
